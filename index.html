<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autolavaggio — Buoni Carburante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f0e;
    --surface: #141714;
    --surface2: #1c1f1c;
    --surface3: #242824;
    --border: #2a2e2a;
    --accent: #b8ff45;
    --accent2: #45ffd4;
    --accent-dim: #7ab82e;
    --text: #e8ede8;
    --text-muted: #7a8a7a;
    --text-faint: #3a4a3a;
    --red: #ff5555;
    --diesel: #4a9eff;
    --benzina: #ffb845;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 0.05em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .logo span { color: var(--text-muted); font-weight: 300; }

  .header-date {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ─── TABS ────────────────────────────────────── */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 0 24px;
    gap: 0;
    overflow-x: auto;
  }

  .tab {
    padding: 14px 24px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ─── LAYOUT ──────────────────────────────────── */
  .page { display: none; padding: 28px 24px; max-width: 1100px; margin: 0 auto; }
  .page.active { display: block; }

  /* ─── SECTION TITLE ───────────────────────────── */
  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 20px;
  }
  .section-title .dot { color: var(--accent); }

  /* ─── FORM ────────────────────────────────────── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  input, select, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  select option { background: var(--surface2); }

  .targa-input {
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ─── BUTTONS ─────────────────────────────────── */
  .btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 12px 28px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #0d0f0e;
  }
  .btn-primary:hover { background: #ccff55; transform: translateY(-1px); }

  .btn-secondary {
    background: var(--surface3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .btn-danger {
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
    padding: 6px 12px;
    font-size: 12px;
  }
  .btn-danger:hover { background: var(--red); color: white; }

  .btn-print {
    background: var(--surface3);
    color: var(--accent2);
    border: 1px solid var(--accent2);
  }
  .btn-print:hover { background: var(--accent2); color: #0d0f0e; }

  /* ─── FORM CARD ───────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .card-header {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  /* ─── TABLE ───────────────────────────────────── */
  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--text-faint);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .targa-badge {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: var(--surface3);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .carb-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 500;
  }
  .carb-diesel { background: rgba(74,158,255,0.15); color: var(--diesel); }
  .carb-benzina { background: rgba(255,184,69,0.15); color: var(--benzina); }

  .euro-val {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    color: var(--accent);
  }

  /* ─── STATS BAR ───────────────────────────────── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
  }

  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  /* ─── FILTERS ─────────────────────────────────── */
  .filters {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .filters select, .filters input {
    width: auto;
    min-width: 140px;
  }

  /* ─── REPORT ──────────────────────────────────── */
  .report-company {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .report-company-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--surface2);
    cursor: pointer;
    user-select: none;
  }

  .report-company-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .report-company-total {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    color: var(--accent);
  }

  .report-company-body { padding: 0 18px 14px; }

  .plate-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--text-faint);
  }
  .plate-row:last-child { border-bottom: none; }

  .plate-count {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ─── PRINT RECEIPT ───────────────────────────── */
  .receipt-preview {
    background: white;
    color: #1a1a1a;
    width: 320px;
    margin: 0 auto;
    padding: 24px 20px;
    font-family: 'DM Mono', monospace;
    border-radius: 4px;
    position: relative;
  }

  .receipt-preview::after {
    content: '';
    display: block;
    height: 20px;
    background: repeating-linear-gradient(
      135deg,
      white 0px, white 8px,
      #f0f0f0 8px, #f0f0f0 10px
    );
    margin: 16px -20px -24px;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
  }

  .receipt-title {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.1em;
    border-bottom: 2px dashed #ccc;
    padding-bottom: 12px;
    margin-bottom: 12px;
  }

  .receipt-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 6px;
  }

  .receipt-row .key { color: #666; text-transform: uppercase; font-size: 11px; }
  .receipt-row .val { font-weight: bold; }

  .receipt-total {
    border-top: 2px dashed #ccc;
    margin-top: 12px;
    padding-top: 12px;
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
  }

  .receipt-signature {
    margin-top: 78px;
    margin-bottom: 6px;
  }
  .receipt-signature-line {
    border-top: 1px dashed #999;
    width: 70%;
    margin: 0 auto;
  }
  .receipt-signature-label {
    text-align: center;
    font-size: 10px;
    color: #999;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .receipt-footer {
    text-align: center;
    font-size: 10px;
    color: #999;
    margin-top: 12px;
    letter-spacing: 0.05em;
  }

  /* ─── MODAL ───────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 90%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 20px;
    color: var(--accent);
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    justify-content: flex-end;
  }

  /* ─── TOAST ───────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--accent);
    color: #0d0f0e;
    padding: 12px 20px;
    border-radius: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(.22,.68,0,1.4);
    z-index: 300;
    pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ─── EMPTY STATE ─────────────────────────────── */
  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .empty .icon { font-size: 40px; margin-bottom: 12px; }

  /* ─── TOOLBAR ─────────────────────────────────── */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }

  .toolbar-left { display: flex; gap: 10px; flex-wrap: wrap; }


  /* ─── PRODOTTI EXTRA ───────────────────────────── */
  .extra-prodotti { margin-top: 14px; }
  .extra-prodotti-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .extra-prodotti-header label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .extra-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .extra-row input[type="text"] { flex: 2; }
  .extra-row input[type="number"] { flex: 1; min-width: 80px; }
  .extra-row .btn-remove { padding: 6px 10px; font-size: 14px; line-height: 1; color: var(--red); background: transparent; border: 1px solid var(--red); border-radius: 6px; cursor: pointer; }
  .totale-preview { margin-top: 10px; text-align: right; font-family: "DM Mono", monospace; font-size: 15px; font-weight: 700; color: var(--accent); }

  /* ─── SYNC BAR ─────────────────────────────────── */
  .sync-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
  }
  .sync-bar .sync-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-right: 4px;
  }
  .sync-status {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
  }
  .sync-status.ok { color: var(--accent); }
  .sync-status.err { color: var(--red); }

  /* ─── IMPORT/EXPORT MODAL ───────────────────────── */
  .json-area {
    width: 100%;
    min-height: 120px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 10px;
    margin-top: 8px;
    resize: vertical;
  }

  /* ─── SCROLLBAR ───────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .chevron { transition: transform 0.2s; display: inline-block; }
  .collapsed .chevron { transform: rotate(-90deg); }
</style>
</head>
<body>

<header class="no-print">
  <div class="logo"><span style="color:var(--text);font-weight:400;">Buoni Carburante</span></div>
  <div class="header-date" id="hdrDate"></div>
</header>

<!-- ────────────────── SYNC BAR ────────────────────── -->
<div class="sync-bar no-print">
  <span class="sync-label">☁ Firebase</span>
  <button class="btn btn-secondary" style="padding:5px 14px;font-size:12px;" onclick="apriModalSync('export')">⬇ Esporta JSON</button>
  <button class="btn btn-secondary" style="padding:5px 14px;font-size:12px;" onclick="apriModalSync('import')">⬆ Importa JSON</button>
  <span class="sync-status" id="syncStatus">⏳ Connessione...</span>
</div>

<div class="tabs no-print">
  <button class="tab active" onclick="showPage('nuovo')">➕ Nuovo Buono</button>
  <button class="tab" onclick="showPage('registro')">📋 Registro</button>
  <button class="tab" onclick="showPage('report')">📊 Report Mensile</button>
  <button class="tab" onclick="showPage('societa')">🏢 Società</button>
</div>

<!-- ────────────────── NUOVO BUONO ────────────────── -->
<div id="page-nuovo" class="page active">
  <div class="section-title">Nuovo Buono <span class="dot">.</span></div>

  <div class="card">
    <div class="card-header">Dati Buono</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Data</label>
        <input type="date" id="f-data">
      </div>
      <div class="form-group">
        <label>Importo (€)</label>
        <input type="number" id="f-euro" placeholder="0.00" step="0.01" min="0" oninput="aggiornaTotalePreview()">
      </div>
      <div class="form-group">
        <label>Società</label>
        <select id="f-societa">
          <option value="">— Seleziona —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Carburante</label>
        <select id="f-carburante">
          <option value="DIESEL">Diesel</option>
          <option value="BENZINA">Benzina</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Targa</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="f-targa" style="flex:1;"></select>
          <button type="button" id="btn-nuova-targa" class="btn btn-secondary" style="padding:8px 14px;font-size:12px;white-space:nowrap;display:none;" onclick="aggiuntaTargaVeloce()">+ Nuova</button>
        </div>
        <div id="nuova-targa-inline" style="display:none;margin-top:8px;display:none;gap:8px;align-items:center;">
          <input type="text" id="nuova-targa-input" placeholder="Es. AB123CD" style="flex:1;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
          <button type="button" class="btn btn-primary" style="padding:8px 14px;font-size:12px;" onclick="confermaTargaVeloce()">✓ Aggiungi</button>
          <button type="button" class="btn btn-secondary" style="padding:8px 14px;font-size:12px;" onclick="annullaTargaVeloce()">✕</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── PRODOTTI EXTRA ── -->
  <div class="card extra-prodotti">
    <div class="extra-prodotti-header">
      <label>Prodotti Extra (olio, spazzole, adblue…)</label>
      <button type="button" class="btn btn-secondary" style="padding:6px 14px;font-size:12px;" onclick="aggiungiRigaExtra()">+ Aggiungi riga</button>
    </div>
    <div id="extra-righe"></div>
    <div class="totale-preview" id="totale-preview" style="display:none;">TOTALE: € 0.00</div>
  </div>

  <div style="display:flex; gap:12px; flex-wrap:wrap;">
    <button class="btn btn-primary" onclick="salvaBuono()">💾 Salva e Stampa</button>
    <button class="btn btn-secondary" onclick="soloSalva()">Salva senza stampa</button>
    <button class="btn btn-secondary" onclick="resetForm()">✕ Reset</button>
  </div>
</div>

<!-- ────────────────── REGISTRO ───────────────────── -->
<div id="page-registro" class="page">
  <div class="section-title">Registro Buoni <span class="dot">.</span></div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="filters">
          <div class="form-group">
            <label>Mese</label>
            <select id="filtro-mese" onchange="renderRegistro()">
              <option value="">Tutti</option>
              <option value="1">Gennaio</option><option value="2">Febbraio</option>
              <option value="3">Marzo</option><option value="4">Aprile</option>
              <option value="5">Maggio</option><option value="6">Giugno</option>
              <option value="7">Luglio</option><option value="8">Agosto</option>
              <option value="9">Settembre</option><option value="10">Ottobre</option>
              <option value="11">Novembre</option><option value="12">Dicembre</option>
            </select>
          </div>
          <div class="form-group">
            <label>Anno</label>
            <select id="filtro-ann
