<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autolavaggio — Buoni Carburante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f0e;
    --surface: #141714;
    --surface2: #1c1f1c;
    --surface3: #242824;
    --border: #2a2e2a;
    --accent: #b8ff45;
    --accent2: #45ffd4;
    --accent-dim: #7ab82e;
    --text: #e8ede8;
    --text-muted: #7a8a7a;
    --text-faint: #3a4a3a;
    --red: #ff5555;
    --diesel: #4a9eff;
    --benzina: #ffb845;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 0.05em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .logo span { color: var(--text-muted); font-weight: 300; }

  .header-date {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ─── TABS ────────────────────────────────────── */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 0 24px;
    gap: 0;
    overflow-x: auto;
  }

  .tab {
    padding: 14px 24px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ─── LAYOUT ──────────────────────────────────── */
  .page { display: none; padding: 28px 24px; max-width: 1100px; margin: 0 auto; }
  .page.active { display: block; }

  /* ─── SECTION TITLE ───────────────────────────── */
  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 20px;
  }
  .section-title .dot { color: var(--accent); }

  /* ─── FORM ────────────────────────────────────── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  input, select, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  select option { background: var(--surface2); }

  .targa-input {
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ─── BUTTONS ─────────────────────────────────── */
  .btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 12px 28px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #0d0f0e;
  }
  .btn-primary:hover { background: #ccff55; transform: translateY(-1px); }

  .btn-secondary {
    background: var(--surface3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .btn-danger {
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
    padding: 6px 12px;
    font-size: 12px;
  }
  .btn-danger:hover { background: var(--red); color: white; }

  .btn-print {
    background: var(--surface3);
    color: var(--accent2);
    border: 1px solid var(--accent2);
  }
  .btn-print:hover { background: var(--accent2); color: #0d0f0e; }

  /* ─── FORM CARD ───────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .card-header {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  /* ─── TABLE ───────────────────────────────────── */
  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--text-faint);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .targa-badge {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: var(--surface3);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .carb-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 500;
  }
  .carb-diesel { background: rgba(74,158,255,0.15); color: var(--diesel); }
  .carb-benzina { background: rgba(255,184,69,0.15); color: var(--benzina); }

  .euro-val {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    color: var(--accent);
  }

  /* ─── STATS BAR ───────────────────────────────── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
  }

  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  /* ─── FILTERS ─────────────────────────────────── */
  .filters {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .filters select, .filters input {
    width: auto;
    min-width: 140px;
  }

  /* ─── REPORT ──────────────────────────────────── */
  .report-company {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .report-company-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--surface2);
    cursor: pointer;
    user-select: none;
  }

  .report-company-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .report-company-total {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    color: var(--accent);
  }

  .report-company-body { padding: 0 18px 14px; }

  .plate-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--text-faint);
  }
  .plate-row:last-child { border-bottom: none; }

  .plate-count {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ─── PRINT RECEIPT ───────────────────────────── */
  .receipt-preview {
    background: white;
    color: #1a1a1a;
    width: 320px;
    margin: 0 auto;
    padding: 24px 20px;
    font-family: 'DM Mono', monospace;
    border-radius: 4px;
    position: relative;
  }

  .receipt-preview::after {
    content: '';
    display: block;
    height: 20px;
    background: repeating-linear-gradient(
      135deg,
      white 0px, white 8px,
      #f0f0f0 8px, #f0f0f0 10px
    );
    margin: 16px -20px -24px;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
  }

  .receipt-title {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.1em;
    border-bottom: 2px dashed #ccc;
    padding-bottom: 12px;
    margin-bottom: 12px;
  }

  .receipt-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 6px;
  }

  .receipt-row .key { color: #666; text-transform: uppercase; font-size: 11px; }
  .receipt-row .val { font-weight: bold; }

  .receipt-total {
    border-top: 2px dashed #ccc;
    margin-top: 12px;
    padding-top: 12px;
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
  }

  .receipt-signature {
    margin-top: 78px;
    margin-bottom: 6px;
  }
  .receipt-signature-line {
    border-top: 1px dashed #999;
    width: 70%;
    margin: 0 auto;
  }
  .receipt-signature-label {
    text-align: center;
    font-size: 10px;
    color: #999;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .receipt-footer {
    text-align: center;
    font-size: 10px;
    color: #999;
    margin-top: 12px;
    letter-spacing: 0.05em;
  }

  /* ─── MODAL ───────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 90%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 20px;
    color: var(--accent);
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    justify-content: flex-end;
  }

  /* ─── TOAST ───────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--accent);
    color: #0d0f0e;
    padding: 12px 20px;
    border-radius: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(.22,.68,0,1.4);
    z-index: 300;
    pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ─── EMPTY STATE ─────────────────────────────── */
  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .empty .icon { font-size: 40px; margin-bottom: 12px; }

  /* ─── TOOLBAR ─────────────────────────────────── */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }

  .toolbar-left { display: flex; gap: 10px; flex-wrap: wrap; }


  /* ─── PRODOTTI EXTRA ───────────────────────────── */
  .extra-prodotti { margin-top: 14px; }
  .extra-prodotti-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .extra-prodotti-header label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .extra-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .extra-row input[type="text"] { flex: 2; }
  .extra-row input[type="number"] { flex: 1; min-width: 80px; }
  .extra-row .btn-remove { padding: 6px 10px; font-size: 14px; line-height: 1; color: var(--red); background: transparent; border: 1px solid var(--red); border-radius: 6px; cursor: pointer; }
  .totale-preview { margin-top: 10px; text-align: right; font-family: "DM Mono", monospace; font-size: 15px; font-weight: 700; color: var(--accent); }

  /* ─── SYNC BAR ─────────────────────────────────── */
  .sync-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
  }
  .sync-bar .sync-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-right: 4px;
  }
  .sync-status {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
  }
  .sync-status.ok { color: var(--accent); }
  .sync-status.err { color: var(--red); }

  /* ─── IMPORT/EXPORT MODAL ───────────────────────── */
  .json-area {
    width: 100%;
    min-height: 120px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 10px;
    margin-top: 8px;
    resize: vertical;
  }

  /* ─── SCROLLBAR ───────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .chevron { transition: transform 0.2s; display: inline-block; }
  .collapsed .chevron { transform: rotate(-90deg); }
</style>
</head>
<body>

<header class="no-print">
  <div class="logo"><span style="color:var(--text);font-weight:400;">Buoni Carburante</span></div>
  <div class="header-date" id="hdrDate"></div>
</header>

<!-- ────────────────── SYNC BAR ────────────────────── -->
<div class="sync-bar no-print">
  <span class="sync-label">☁ Firebase</span>
  <button class="btn btn-secondary" style="padding:5px 14px;font-size:12px;" onclick="apriModalSync('export')">⬇ Esporta JSON</button>
  <button class="btn btn-secondary" style="padding:5px 14px;font-size:12px;" onclick="apriModalSync('import')">⬆ Importa JSON</button>
  <span class="sync-status" id="syncStatus">⏳ Connessione...</span>
</div>

<div class="tabs no-print">
  <button class="tab active" onclick="showPage('nuovo')">➕ Nuovo Buono</button>
  <button class="tab" onclick="showPage('registro')">📋 Registro</button>
  <button class="tab" onclick="showPage('report')">📊 Report Mensile</button>
  <button class="tab" onclick="showPage('societa')">🏢 Società</button>
</div>

<!-- ────────────────── NUOVO BUONO ────────────────── -->
<div id="page-nuovo" class="page active">
  <div class="section-title">Nuovo Buono <span class="dot">.</span></div>

  <div class="card">
    <div class="card-header">Dati Buono</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Data</label>
        <input type="date" id="f-data">
      </div>
      <div class="form-group">
        <label>Importo (€)</label>
        <input type="number" id="f-euro" placeholder="0.00" step="0.01" min="0" oninput="aggiornaTotalePreview()">
      </div>
      <div class="form-group">
        <label>Società</label>
        <select id="f-societa">
          <option value="">— Seleziona —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Carburante</label>
        <select id="f-carburante">
          <option value="DIESEL">Diesel</option>
          <option value="BENZINA">Benzina</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Targa</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="f-targa" style="flex:1;"></select>
          <button type="button" id="btn-nuova-targa" class="btn btn-secondary" style="padding:8px 14px;font-size:12px;white-space:nowrap;display:none;" onclick="aggiuntaTargaVeloce()">+ Nuova</button>
        </div>
        <div id="nuova-targa-inline" style="display:none;margin-top:8px;display:none;gap:8px;align-items:center;">
          <input type="text" id="nuova-targa-input" placeholder="Es. AB123CD" style="flex:1;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
          <button type="button" class="btn btn-primary" style="padding:8px 14px;font-size:12px;" onclick="confermaTargaVeloce()">✓ Aggiungi</button>
          <button type="button" class="btn btn-secondary" style="padding:8px 14px;font-size:12px;" onclick="annullaTargaVeloce()">✕</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── PRODOTTI EXTRA ── -->
  <div class="card extra-prodotti">
    <div class="extra-prodotti-header">
      <label>Prodotti Extra (olio, spazzole, adblue…)</label>
      <button type="button" class="btn btn-secondary" style="padding:6px 14px;font-size:12px;" onclick="aggiungiRigaExtra()">+ Aggiungi riga</button>
    </div>
    <div id="extra-righe"></div>
    <div class="totale-preview" id="totale-preview" style="display:none;">TOTALE: € 0.00</div>
  </div>

  <div style="display:flex; gap:12px; flex-wrap:wrap;">
    <button class="btn btn-primary" onclick="salvaBuono()">💾 Salva e Stampa</button>
    <button class="btn btn-secondary" onclick="soloSalva()">Salva senza stampa</button>
    <button class="btn btn-secondary" onclick="resetForm()">✕ Reset</button>
  </div>
</div>

<!-- ────────────────── REGISTRO ───────────────────── -->
<div id="page-registro" class="page">
  <div class="section-title">Registro Buoni <span class="dot">.</span></div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="filters">
          <div class="form-group">
            <label>Mese</label>
            <select id="filtro-mese" onchange="renderRegistro()">
              <option value="">Tutti</option>
              <option value="1">Gennaio</option><option value="2">Febbraio</option>
              <option value="3">Marzo</option><option value="4">Aprile</option>
              <option value="5">Maggio</option><option value="6">Giugno</option>
              <option value="7">Luglio</option><option value="8">Agosto</option>
              <option value="9">Settembre</option><option value="10">Ottobre</option>
              <option value="11">Novembre</option><option value="12">Dicembre</option>
            </select>
          </div>
          <div class="form-group">
            <label>Anno</label>
            <select id="filtro-anno" onchange="renderRegistro()">
              <option value="">Tutti</option>
              <option value="2025">2025</option>
              <option value="2026">2026</option>
            </select>
          </div>
          <div class="form-group">
            <label>Società</label>
            <select id="filtro-soc" onchange="renderRegistro()">
              <option value="">Tutte</option>
            </select>
          </div>
        </div>
      </div>
      <button class="btn btn-secondary" onclick="esportaCSV()">⬇ Esporta CSV</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Data</th>
            <th>Società</th>
            <th>Targa</th>
            <th>Carburante</th>
            <th>€</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="registroBody"></tbody>
      </table>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
// ═══════════════════════════════════════════════
//  STAMPA BLUETOOTH ESC/POS (58mm termica)
// ═══════════════════════════════════════════════

var btDevice = null;
var btCharacteristic = null;

// UUID servizio stampante termica (standard ESC/POS BT)
var PRINTER_SERVICE = '000018f0-0000-1000-8000-00805f9b34fb';
var PRINTER_CHAR    = '00002af1-0000-1000-8000-00805f9b34fb';

async function connettiBluetooth() {
  if (!navigator.bluetooth) {
    showToast('⚠ Bluetooth non supportato. Usa Chrome su Android.');
    return false;
  }
  try {
    showToast('🔵 Ricerca stampante...');
    btDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [PRINTER_SERVICE] }],
      optionalServices: [PRINTER_SERVICE]
    });
    const server = await btDevice.gatt.connect();
    const service = await server.getPrimaryService(PRINTER_SERVICE);
    btCharacteristic = await service.getCharacteristic(PRINTER_CHAR);
    showToast('✓ Stampante connessa: ' + btDevice.name);
    return true;
  } catch(e) {
    // Prova UUID generico se il primo non funziona
    try {
      btDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [PRINTER_SERVICE, '49535343-fe7d-4ae5-8fa9-9fafd205e455']
      });
      const server = await btDevice.gatt.connect();
      try {
        const service = await server.getPrimaryService(PRINTER_SERVICE);
        btCharacteristic = await service.getCharacteristic(PRINTER_CHAR);
      } catch(e2) {
        const service = await server.getPrimaryService('49535343-fe7d-4ae5-8fa9-9fafd205e455');
        btCharacteristic = await service.getCharacteristic('49535343-1e4d-4bd9-ba61-23c647249616');
      }
      showToast('✓ Stampante connessa: ' + btDevice.name);
      return true;
    } catch(e2) {
      showToast('✕ Connessione fallita. Verifica che la stampante sia accesa.');
      btDevice = null; btCharacteristic = null;
      return false;
    }
  }
}

async function inviaBytes(data) {
  if (!btCharacteristic) return;
  // Invia in chunk da 512 byte
  var chunkSize = 512;
  for (var i = 0; i < data.length; i += chunkSize) {
    var chunk = data.slice(i, i + chunkSize);
    await btCharacteristic.writeValue(chunk);
    await new Promise(r => setTimeout(r, 50));
  }
}

function escPos(b) {
  // Costruttore comandi ESC/POS
  var cmds = [];

  // Inizializza stampante
  cmds.push(0x1B, 0x40);

  b.forEach(function(cmd) {
    if (typeof cmd === 'number') {
      cmds.push(cmd);
    } else if (typeof cmd === 'string') {
      // Converti stringa in bytes (ISO-8859-1)
      for (var i = 0; i < cmd.length; i++) {
        var c = cmd.charCodeAt(i);
        cmds.push(c < 256 ? c : 63); // ? per caratteri non supportati
      }
    } else if (Array.isArray(cmd)) {
      cmd.forEach(function(b) { cmds.push(b); });
    }
  });

  return new Uint8Array(cmds);
}

function buildEscPosRicevuta(b) {
  var d = new Date(b.data + 'T00:00:00');
  var dataStr = d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'});
  var numBuono = String(b.id).padStart(4, '0');
  var euroCarb = b.euroCarb !== undefined ? b.euroCarb : b.euro;
  var extra = b.extra || [];

  // Funzioni helper ESC/POS
  var INIT        = [0x1B, 0x40];
  var CENTER      = [0x1B, 0x61, 0x01];
  var LEFT        = [0x1B, 0x61, 0x00];
  var BOLD_ON     = [0x1B, 0x45, 0x01];
  var BOLD_OFF    = [0x1B, 0x45, 0x00];
  var BIG_ON      = [0x1D, 0x21, 0x11]; // doppia altezza e larghezza
  var BIG_OFF     = [0x1D, 0x21, 0x00];
  var TALL_ON     = [0x1D, 0x21, 0x01]; // solo altezza doppia
  var LF          = [0x0A];
  var DASHED      = '--------------------------------
';
  var CUT         = [0x1D, 0x56, 0x41, 0x03]; // taglio parziale

  // Funzione per riga etichetta/valore su 32 caratteri
  function rigaLV(label, valore) {
    var l = label.toUpperCase();
    var v = String(valore);
    var spazi = 32 - l.length - v.length;
    if (spazi < 1) spazi = 1;
    return l + ' '.repeat(spazi) + v + '
';
  }

  var cmds = [];
  cmds.push(INIT);

  // ── Intestazione centrata ──
  cmds.push(CENTER);
  cmds.push(BOLD_ON);
  cmds.push('DISTRIBUTORE DI CARBURANTE
');
  cmds.push(BIG_ON);
  cmds.push('TOTALERG
');
  cmds.push(BIG_OFF);
  cmds.push(BOLD_OFF);
  cmds.push('di Fabrizi Emanuela
');
  cmds.push('-- BUONO CARBURANTE --
');
  cmds.push(LF);

  // ── Separatore ──
  cmds.push(LEFT);
  cmds.push(DASHED);

  // ── Dati ──
  cmds.push(BOLD_ON);
  cmds.push(rigaLV('N. Buono', numBuono));
  cmds.push(rigaLV('Data', dataStr));
  cmds.push(DASHED);
  cmds.push(rigaLV('Societa', b.societa.toUpperCase()));
  cmds.push(rigaLV('Targa', b.targa || 'N/D'));
  cmds.push(DASHED);
  cmds.push(rigaLV('Carburante', b.carburante));
  cmds.push(rigaLV('Importo', 'EUR ' + euroCarb.toFixed(2)));
  cmds.push(BOLD_OFF);

  // ── Prodotti extra ──
  if (extra.length > 0) {
    cmds.push(DASHED);
    cmds.push(BOLD_ON);
    cmds.push('ALTRI PRODOTTI
');
    cmds.push(BOLD_OFF);
    extra.forEach(function(p) {
      cmds.push(rigaLV(p.desc, 'EUR ' + p.euro.toFixed(2)));
    });
  }

  // ── Totale ──
  cmds.push(DASHED);
  cmds.push(CENTER);
  cmds.push(BOLD_ON);
  cmds.push(BIG_ON);
  cmds.push('TOTALE
');
  cmds.push('EUR ' + b.euro.toFixed(2) + '
');
  cmds.push(BIG_OFF);
  cmds.push(BOLD_OFF);
  cmds.push(LF);

  // ── Firma ──
  cmds.push(LEFT);
  cmds.push('--------------------------------
');
  cmds.push(CENTER);
  cmds.push('Firma
');
  cmds.push(LF);
  cmds.push(LF);

  // ── Footer ──
  cmds.push('Grazie per la fiducia
');
  cmds.push('Conservare questo scontrino
');
  cmds.push(LF);
  cmds.push(LF);
  cmds.push(LF);

  // ── Taglio ──
  cmds.push(CUT);

  return escPos(cmds);
}

</script>

  const carb = parseFloat(document.getElementById('f-euro').value) || 0;

  const sommaExtra = extra.reduce((s, p) => s + p.euro, 0);
  const totale = carb + sommaExtra;

  if (extra.length > 0 || carb > 0) {
    el.style.display = 'block';
    el.textContent = 'TOTALE: € ' + totale.toFixed(2);

    el.style.display = 'none';

function getExtraProdotti() {
  const righe = document.querySelectorAll('#extra-righe .extra-row');

  righe.forEach(function(row) {

    const euro = parseFloat(row.querySelector('input[type="number"]').value) || 0;
    if (desc || euro > 0) result.push({ desc: desc || '—', euro: euro });

  return result;

  resetForm();
  showToast('✓ Buono #' + b.id + ' salvato');
}

function mostraAnteprima(b) {
  currentReceiptData = b;
  document.getElementById('receiptContainer').innerHTML = buildReceipt(b);
  document.getElementById('modalStampa').classList.add('open');
}

function buildReceipt(b) {
  const d = new Date(b.data + 'T00:00:00');
  const dateStr = d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'});
  const timeStr = new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
  const euroCarb = b.euroCarb !== undefined ? b.euroCarb : b.euro;
  const extra = b.extra || [];
  let extraRows = '';
  if (extra.length > 0) {
    extraRows += '<div style="border-top:1px dashed #ddd;margin:8px 0 4px;"></div>';
    extra.forEach(function(p) {
      extraRows += '<div class="receipt-row"><span class="key">' + p.desc + '</span><span class="val">€ ' + p.euro.toFixed(2) + '</span></div>';
    });
  }
  return `
  <div class="receipt-preview">
    <div class="receipt-title">DISTRIBUTORE DI CARBURANTE<br><span style="font-size:11px;font-weight:600;letter-spacing:0.05em;">TOTALERG</span><br><span style="font-size:11px;font-weight:400;">di Fabrizi Emanuela</span><br><span style="font-size:10px;font-weight:400;color:#999;">— BUONO CARBURANTE —</span></div>
    <div class="receipt-row"><span class="key">N° Buono</span><span class="val">#${String(b.id).padStart(4,'0')}</span></div>
    <div class="receipt-row"><span class="key">Data</span><span class="val">${dateStr} ${timeStr}</span></div>
    <div class="receipt-row" style="margin-top:10px"><span class="key">Società</span><span class="val">${b.societa.toUpperCase()}</span></div>
    <div class="receipt-row"><span class="key">Targa</span><span class="val">${b.targa || '—'}</span></div>
    <div class="receipt-row"><span class="key">Carburante</span><span class="val">${b.carburante} — € ${euroCarb.toFixed(2)}</span></div>
    ${extraRows}
    <div class="receipt-total"><span>TOTALE</span><span>€ ${b.euro.toFixed(2)}</span></div>
    <div class="receipt-signature"><div class="receipt-signature-line"></div><div class="receipt-signature-label">Firma</div></div>
    <div class="receipt-footer">★ Grazie per la fiducia ★<br>Conservare questo scontrino</div>
  </div>`;
}

function chiudiModal() {
  document.getElementById('modalStampa').classList.remove('open');
  resetForm();
}

function scaricaPDF() {
  var b = currentReceiptData;
  if (!b) return;
  generaPDFbuono(b);
  document.getElementById('modalStampa').classList.remove('open');
  resetForm();
}

function generaPDFbuono(b) {
  var { jsPDF } = window.jspdf;
  // Calcola altezza dinamica in base ai prodotti extra
  var extra = b.extra || [];
  var altezza = 150 + (extra.length * 8);
  var doc = new jsPDF({ unit: 'mm', format: [80, altezza], orientation: 'portrait' });

  var d = new Date(b.data + 'T00:00:00');
  var dataStr = d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'});
  var numBuono = String(b.id).padStart(4, '0');
  var euroCarb = b.euroCarb !== undefined ? b.euroCarb : b.euro;

  var cx = 40;  // centro
  var lx = 5;   // colonna sinistra (etichetta)
  var rx = 75;  // colonna destra (valore)
  var y = 10;

  // ── Intestazione ──
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(8);
  doc.setTextColor(40, 40, 40);
  doc.text('DISTRIBUTORE DI CARBURANTE', cx, y, {align:'center'});
  y += 5;
  doc.setFontSize(12);
  doc.text('TOTALERG', cx, y, {align:'center'});
  y += 5;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.text('di Fabrizi Emanuela', cx, y, {align:'center'});
  y += 5;
  doc.setFontSize(7);
  doc.setTextColor(150, 150, 150);
  doc.text('- BUONO CARBURANTE -', cx, y, {align:'center'});
  doc.setTextColor(0, 0, 0);
  y += 4;

  // Linea separatore
  doc.setLineDashPattern([1.5, 1], 0);
  doc.setDrawColor(160, 160, 160);
  doc.setLineWidth(0.3);
  doc.line(4, y, 54, y);
  y += 6;

  // ── Funzione riga etichetta / valore ──
  function riga(label, valore, grassettoVal) {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7);
    doc.setTextColor(130, 130, 130);
    doc.text(label.toUpperCase(), lx, y);
    doc.setFont('helvetica', grassettoVal !== false ? 'bold' : 'normal');
    doc.setFontSize(8);
    doc.setTextColor(20, 20, 20);
    doc.text(String(valore), rx, y, {align:'right'});
    y += 6;
  }

  // ── Dati identificativi ──
  riga('N. Buono', '#' + numBuono);
  riga('Data', dataStr);
  y += 1;

  // Linea sottile
  doc.setLineDashPattern([0.5, 0.8], 0);
  doc.setDrawColor(210, 210, 210);
  doc.line(4, y, 54, y);
  y += 4;

  riga('Societa', b.societa.toUpperCase());
  riga('Targa', b.targa || 'N/D');
  y += 1;

  // Linea sottile
  doc.setLineDashPattern([0.5, 0.8], 0);
  doc.setDrawColor(210, 210, 210);
  doc.line(4, y, 54, y);
  y += 4;

  // ── Carburante ──
  riga('Carburante', b.carburante);
  riga('Importo carb.', 'EUR ' + euroCarb.toFixed(2));

  // ── Prodotti extra ──
  if (extra.length > 0) {
    y += 1;
    doc.setLineDashPattern([0.5, 0.8], 0);
    doc.setDrawColor(210, 210, 210);
    doc.line(4, y, 54, y);
    y += 4;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(7);
    doc.setTextColor(100, 100, 100);
    doc.text('ALTRI PRODOTTI', lx, y);
    y += 5;
    extra.forEach(function(p) {
      riga(p.desc, 'EUR ' + p.euro.toFixed(2));
    });
  }

  // ── Linea totale ──
  y += 2;
  doc.setLineDashPattern([1.5, 1], 0);
  doc.setDrawColor(60, 60, 60);
  doc.setLineWidth(0.4);
  doc.line(4, y, 54, y);
  y += 6;

  // ── Totale ──
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9);
  doc.setTextColor(40, 40, 40);
  doc.text('TOTALE', lx, y);
  doc.setFontSize(12);
  doc.text('EUR ' + b.euro.toFixed(2), rx, y, {align:'right'});
  y += 16;

  // ── Spazio firma ──
  doc.setLineDashPattern([1, 1], 0);
  doc.setDrawColor(160, 160, 160);
  doc.setLineWidth(0.3);
  doc.line(12, y, 68, y);
  y += 4;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7);
  doc.setTextColor(160, 160, 160);
  doc.text('Firma', cx, y, {align:'center'});
  y += 8;

  // ── Footer ──
  doc.setFontSize(6.5);
  doc.setTextColor(180, 180, 180);
  doc.text('Grazie per la fiducia', cx, y, {align:'center'});
  y += 4;
  doc.text('Conservare questo scontrino', cx, y, {align:'center'});

  doc.save('buono_' + numBuono + '_' + b.societa.replace(/\s/g,'_') + '.pdf');
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  event.target.classList.add('active');

  if (id === 'registro') renderRegistro();
  if (id === 'report') renderReport();
  if (id === 'societa') renderSocietaList();
}

function renderRegistro() {
  const mese = document.getElementById('filtro-mese').value;
  const anno = document.getElementById('filtro-anno').value;
  const soc = document.getElementById('filtro-soc').value;

  let lista = [...db.buoni].reverse();

  if (mese) lista = lista.filter(b => {
    const d = new Date(b.data + 'T00:00:00');
    return (d.getMonth() + 1) == parseInt(mese);
  });
  if (anno) lista = lista.filter(b => {
    const d = new Date(b.data + 'T00:00:00');
    return d.getFullYear() == parseInt(anno);
  });
  if (soc) lista = lista.filter(b => b.societa === soc);

  // Stats
  const totEuro = lista.reduce((s,b) => s + b.euro, 0);
  const totBuoni = lista.length;
  const socUniche = new Set(lista.map(b=>b.societa)).size;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-box"><div class="stat-label">Buoni</div><div class="stat-value">${totBuoni}</div></div>
    <div class="stat-box"><div class="stat-label">Totale €</div><div class="stat-value">${totEuro.toFixed(2)}</div></div>
    <div class="stat-box"><div class="stat-label">Società</div><div class="stat-value">${socUniche}</div></div>
  `;

  const tbody = document.getElementById('registroBody');
  const empty = document.getElementById('registroEmpty');

  if (lista.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = lista.map((b, i) => {
    const d = new Date(b.data + 'T00:00:00');
    const dateStr = d.toLocaleDateString('it-IT');
    const carbClass = b.carburante === 'BENZINA' ? 'carb-benzina' : 'carb-diesel';
    return `<tr>
      <td style="color:var(--text-muted);font-family:'DM Mono',monospace;font-size:12px">#${String(b.id).padStart(4,'0')}</td>
      <td style="font-family:'DM Mono',monospace;font-size:13px">${dateStr}</td>
      <td><strong>${b.societa}</strong></td>
      <td>${b.targa ? `<span class="targa-badge">${b.targa}</span>` : '<span style="color:var(--text-muted)">—</span>'}</td>
      <td><span class="carb-badge ${carbClass}">${b.carburante}</span></td>
      <td class="euro-val">€ ${b.euro.toFixed(2)}</td>
      <td style="display:flex;gap:6px;">
        <button class="btn btn-print" style="padding:5px 10px;font-size:11px;" title="Anteprima" onclick="ristampaBuono(${b.id})">👁</button>
        <button class="btn btn-print" style="padding:5px 10px;font-size:11px;" title="Stampa Bluetooth" onclick="stampaBluetoothId(${b.id})">🖨</button>
        <button class="btn btn-danger" onclick="eliminaBuono(${b.id})">✕</button>
      </td>
    </tr>`;
  }).join('');
}

function eliminaBuono(id) {
  if (!confirm('Eliminare il buono #' + String(id).padStart(4,'0') + '?')) return;
  db.buoni = db.buoni.filter(b => b.id !== id);
  saveData();
  renderRegistro();
  showToast('Buono eliminato');
}

function ristampaBuono(id) {
  const b = db.buoni.find(x => x.id === id);
  if (b) mostraAnteprima(b);
}

function stampaDiretta(id) {
  const b = db.buoni.find(x => x.id === id);
  if (!b) return;
  generaPDFbuono(b);
}

function esportaCSV() {
  const mese = document.getElementById('filtro-mese').value;
  const anno = document.getElementById('filtro-anno').value;
  const soc = document.getElementById('filtro-soc').value;

  let lista = [...db.buoni];
  if (mese) lista = lista.filter(b => (new Date(b.data+'T00:00:00').getMonth()+1) == mese);
  if (anno) lista = lista.filter(b => new Date(b.data+'T00:00:00').getFullYear() == anno);
  if (soc) lista = lista.filter(b => b.societa === soc);

  const header = 'ID,DATA,SOCIETA,TARGA,CARBURANTE,EURO\n';
  const rows = lista.map(b =>
    `${b.id},${b.data},${b.societa},${b.targa||''},${b.carburante},${b.euro}`
  ).join('\n');

  const blob = new Blob([header + rows], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `buoni_${anno||'tutti'}_${mese||'tutti'}.csv`;
  a.click();
  showToast('⬇ CSV scaricato');
}

const MESI = ['','Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

function renderReport() {
  const mese = parseInt(document.getElementById('rep-mese').value);
  const anno = parseInt(document.getElementById('rep-anno').value);

  const lista = db.buoni.filter(b => {
    const d = new Date(b.data+'T00:00:00');
    return d.getMonth()+1 === mese && d.getFullYear() === anno;
  });

  const container = document.getElementById('reportContent');

  if (lista.length === 0) {
    container.innerHTML = '<div class="empty"><div class="icon">📭</div>Nessun buono per ' + MESI[mese] + ' ' + anno + '</div>';
    return;
  }

  // Group by company
  const byCompany = {};
  lista.forEach(b => {
    if (!byCompany[b.societa]) byCompany[b.societa] = [];
    byCompany[b.societa].push(b);
  });

  const totale = lista.reduce((s,b)=>s+b.euro,0);

  let html = `
    <div class="stats-bar">
      <div class="stat-box"><div class="stat-label">Periodo</div><div class="stat-value" style="font-size:18px">${MESI[mese]} ${anno}</div></div>
      <div class="stat-box"><div class="stat-label">Tot. Buoni</div><div class="stat-value">${lista.length}</div></div>
      <div class="stat-box"><div class="stat-label">Tot. Importo</div><div class="stat-value">€${totale.toFixed(0)}</div></div>
      <div class="stat-box"><div class="stat-label">Società</div><div class="stat-value">${Object.keys(byCompany).length}</div></div>
    </div>`;

  Object.keys(byCompany).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase())).forEach(soc => {
    const buoni = byCompany[soc];
    const tot = buoni.reduce((s,b)=>s+b.euro,0);

    // Group by plate
    const byPlate = {};
    buoni.forEach(b => {
      const k = b.targa || '—';
      if (!byPlate[k]) byPlate[k] = {count:0, euro:0};
      byPlate[k].count++;
      byPlate[k].euro += b.euro;
    });

    const plateRows = Object.entries(byPlate)
      .sort((a,b)=>b[1].euro-a[1].euro)
      .map(([t,v]) => `
        <div class="plate-row">
          <span class="targa-badge">${t}</span>
          <div style="display:flex;gap:20px;align-items:center;">
            <span class="plate-count">${v.count} buon${v.count===1?'o':'i'}</span>
            <span class="euro-val">€ ${v.euro.toFixed(2)}</span>
          </div>
        </div>`).join('');

    html += `
      <div class="report-company">
        <div class="report-company-header" onclick="toggleReport(this)">
          <span class="report-company-name">${soc}</span>
          <div style="display:flex;gap:16px;align-items:center;">
            <span style="color:var(--text-muted);font-size:13px;">${buoni.length} buon${buoni.length===1?'o':'i'}</span>
            <span class="report-company-total">€ ${tot.toFixed(2)}</span>
            <span class="chevron">▼</span>
          </div>
        </div>
        <div class="report-company-body">${plateRows}</div>
      </div>`;
  });

  container.innerHTML = html;
}

function toggleReport(header) {
  const parent = header.parentElement;
  parent.classList.toggle('collapsed');
  const body = parent.querySelector('.report-company-body');
  body.style.display = parent.classList.contains('collapsed') ? 'none' : 'block';
}

function getReportData() {
  var mese = parseInt(document.getElementById('rep-mese').value);
  var anno = parseInt(document.getElementById('rep-anno').value);
  var lista = db.buoni.filter(function(b) {
    var d = new Date(b.data+'T00:00:00');
    return d.getMonth()+1 === mese && d.getFullYear() === anno;
  });
  var byCompany = {};
  lista.forEach(function(b) {
    if (!byCompany[b.societa]) byCompany[b.societa] = [];
    byCompany[b.societa].push(b);
  });
  var totale = lista.reduce(function(s,b){return s+b.euro;},0);
  return { mese:mese, anno:anno, lista:lista, byCompany:byCompany, totale:totale };
}

function intestazionePDF(doc, titolo, sottotitolo) {
  var pw = doc.internal.pageSize.getWidth();
  var y = 14;
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.text('DISTRIBUTORE DI CARBURANTE TOTALERG', pw/2, y, {align:'center'});
  y += 6;
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.text('di Fabrizi Emanuela', pw/2, y, {align:'center'});
  y += 5;
  doc.setFontSize(8);
  doc.setTextColor(120);
  doc.text(titolo, pw/2, y, {align:'center'});
  y += 4;
  doc.setFontSize(8);
  doc.text(sottotitolo, pw/2, y, {align:'center'});
  doc.setTextColor(0);
  y += 4;
  doc.setDrawColor(40);
  doc.setLineWidth(0.4);
  doc.line(14, y, pw-14, y);
  return y + 5;
}

// ── REPORT DETTAGLIATO (per targa) ──
function scaricaPDFReportDettagliato() {
  var r = getReportData();
  if (r.lista.length === 0) { showToast('Nessun buono nel mese selezionato'); return; }
  var { jsPDF } = window.jspdf;
  var doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
  var pw = doc.internal.pageSize.getWidth();
  var margin = 14;
  var colW = [10, 55, 28, 22, 26]; // #, Societa, Targa, Carb, Euro
  var colX = [margin];
  colW.forEach(function(w,i){ if(i>0) colX.push(colX[i-1]+colW[i-1]); });

  var y = intestazionePDF(doc, 'REPORT DETTAGLIATO BUONI CARBURANTE', MESI[r.mese] + ' ' + r.anno + '  —  ' + r.lista.length + ' buoni');

  // Header tabella
  doc.setFillColor(30,30,30);
  doc.rect(margin, y, pw-margin*2, 7, 'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.setTextColor(255);
  ['N°','Società','Targa','Carb.','€'].forEach(function(h,i){
    doc.text(h, colX[i]+2, y+5);
  });
  doc.setTextColor(0);
  y += 9;

  // Righe dati raggruppate per società
  var societa = Object.keys(r.byCompany).sort(function(a,b){ return a.toLowerCase().localeCompare(b.toLowerCase()); });
  societa.forEach(function(soc) {
    var buoni = r.byCompany[soc].sort(function(a,b){ return new Date(a.data)-new Date(b.data); });
    var socTot = buoni.reduce(function(s,b){return s+b.euro;},0);

    // Controlla spazio pagina
    if (y > 265) { doc.addPage(); y = 20; }

    // Riga intestazione società
    doc.setFillColor(235,235,235);
    doc.rect(margin, y-1, pw-margin*2, 7, 'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(8);
    doc.text(soc.toUpperCase(), colX[1]+2, y+4);
    doc.text('Tot: € '+socTot.toFixed(2), colX[4]+2, y+4);
    y += 8;

    buoni.forEach(function(b) {
      if (y > 270) { doc.addPage(); y = 20; }
      var d = new Date(b.data+'T00:00:00');
      var dataStr = d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'});
      doc.setFont('helvetica','normal');
      doc.setFontSize(7.5);
      doc.text(String(b.id), colX[0]+2, y+3.5);
      doc.text(dataStr, colX[1]+2, y+3.5);
      doc.text(b.targa||'—', colX[2]+2, y+3.5);
      doc.text(b.carburante||'—', colX[3]+2, y+3.5);
      doc.setFont('helvetica','bold');
      doc.text('€ '+b.euro.toFixed(2), colX[4]+2, y+3.5);
      doc.setDrawColor(220);
      doc.setLineWidth(0.1);
      doc.line(margin, y+5.5, pw-margin, y+5.5);
      y += 6;
    });
    y += 2;
  });

  // Totale finale
  if (y > 260) { doc.addPage(); y = 20; }
  doc.setDrawColor(30);
  doc.setLineWidth(0.5);
  doc.line(margin, y, pw-margin, y);
  y += 5;
  doc.setFont('helvetica','bold');
  doc.setFontSize(10);
  doc.text('TOTALE MESE:', margin, y);
  doc.text('€ '+r.totale.toFixed(2), pw-margin, y, {align:'right'});

  doc.save('report_dettagliato_'+MESI[r.mese]+'_'+r.anno+'.pdf');
}

// ── REPORT RIEPILOGO (una riga per società) ──
function scaricaPDFReportRiepilogo() {
  var r = getReportData();
  if (r.lista.length === 0) { showToast('Nessun buono nel mese selezionato'); return; }
  var { jsPDF } = window.jspdf;
  var doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
  var pw = doc.internal.pageSize.getWidth();
  var margin = 14;

  var y = intestazionePDF(doc, 'RIEPILOGO BUONI CARBURANTE PER SOCIETÀ', MESI[r.mese] + ' ' + r.anno + '  —  ' + r.lista.length + ' buoni totali');

  // Header tabella
  var cols = { soc: margin, nBuoni: margin+100, totale: margin+130 };
  doc.setFillColor(30,30,30);
  doc.rect(margin, y, pw-margin*2, 8, 'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.setTextColor(255);
  doc.text('SOCIETÀ', cols.soc+2, y+5.5);
  doc.text('N° BUONI', cols.nBuoni+2, y+5.5);
  doc.text('TOTALE €', cols.totale+2, y+5.5);
  doc.setTextColor(0);
  y += 10;

  // Righe
  var societa = Object.keys(r.byCompany).sort(function(a,b){ return a.toLowerCase().localeCompare(b.toLowerCase()); });
  var alt = false;
  societa.forEach(function(soc) {
    var buoni = r.byCompany[soc];
    var tot = buoni.reduce(function(s,b){return s+b.euro;},0);
    if (alt) { doc.setFillColor(245,245,245); doc.rect(margin, y-1, pw-margin*2, 8, 'F'); }
    alt = !alt;
    doc.setFont('helvetica','bold');
    doc.setFontSize(9);
    doc.text(soc.toUpperCase(), cols.soc+2, y+4.5);
    doc.setFont('helvetica','normal');
    doc.text(String(buoni.length), cols.nBuoni+2, y+4.5);
    doc.setFont('helvetica','bold');
    doc.text('€ '+tot.toFixed(2), cols.totale+2, y+4.5);
    doc.setDrawColor(200);
    doc.setLineWidth(0.1);
    doc.line(margin, y+7, pw-margin, y+7);
    y += 8;
  });

  // Riga totale
  y += 3;
  doc.setDrawColor(30);
  doc.setLineWidth(0.5);
  doc.line(margin, y, pw-margin, y);
  y += 6;
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('TOTALE MESE', cols.soc+2, y);
  doc.text(String(r.lista.length), cols.nBuoni+2, y);
  doc.text('€ '+r.totale.toFixed(2), cols.totale+2, y);

  doc.save('riepilogo_'+MESI[r.mese]+'_'+r.anno+'.pdf');
}

// ═══════════════════════════════════════════════
//  GESTIONE SOCIETÀ
// ═══════════════════════════════════════════════

function aggiungiSocieta() {
  const nome = document.getElementById('new-soc').value.trim();
  const targa = document.getElementById('new-targa').value.trim().toUpperCase();

  if (!nome) { showToast('⚠ Inserisci il nome della società'); return; }
  if (!db.societa[nome]) db.societa[nome] = [];
  if (targa && !db.societa[nome].includes(targa)) {
    db.societa[nome].push(targa);
  }
  saveData();
  populateSocietaSelect();
  renderSocietaList();
  document.getElementById('new-soc').value = '';
  document.getElementById('new-targa').value = '';
  showToast('✓ Società aggiornata');
}

function renderSocietaList() {
  const container = document.getElementById('societaList');
  const socs = Object.keys(db.societa).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));

  container.innerHTML = socs.map(soc => {
    const plates = (db.societa[soc] || []).slice().sort((a,b) => a.localeCompare(b));
    const badges = plates.map(p =>
      `<span class="targa-badge" style="margin:2px">${p} <span style="cursor:pointer;color:var(--red)" onclick="rimuoviTarga('${soc}','${p}')">×</span></span>`
    ).join('');

    return `<div style="padding:14px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;margin-bottom:8px;">${soc}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;">
          ${badges || '<span style="color:var(--text-muted);font-size:13px;">Nessuna targa</span>'}
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap;">
        <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px;" onclick="apriModalTarga('${soc}')">+ Targa</button>
        <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px;" onclick="rinominaSocieta('${soc}')">✏ Rinomina</button>
        <button class="btn btn-danger" style="padding:6px 12px;font-size:12px;" onclick="eliminaSocieta('${soc}')">🗑 Elimina</button>
      </div>
    </div>`;
  }).join('');
}

function apriModalTarga(soc) {
  editTargaForSoc = soc;
  document.getElementById('mt-soc').value = soc;
  document.getElementById('mt-targa').value = '';
  document.getElementById('modalTarga').classList.add('open');
}

function chiudiModalTarga() {
  document.getElementById('modalTarga').classList.remove('open');
  editTargaForSoc = null;
}

function salvaTargaModal() {
  const targa = document.getElementById('mt-targa').value.trim().toUpperCase();
  if (!targa || !editTargaForSoc) return;
  if (!db.societa[editTargaForSoc].includes(targa)) {
    db.societa[editTargaForSoc].push(targa);
  }
  saveData();
  renderSocietaList();
  chiudiModalTarga();
  showToast('✓ Targa aggiunta');
}

function rimuoviTarga(soc, targa) {
  db.societa[soc] = db.societa[soc].filter(t => t !== targa);
  saveData();
  renderSocietaList();
  showToast('Targa rimossa');
}

function eliminaSocieta(soc) {
  if (!confirm(`Eliminare la società "${soc}"? I buoni esistenti non verranno eliminati.`)) return;
  delete db.societa[soc];
  saveData();
  populateSocietaSelect();
  renderSocietaList();
  showToast('Società eliminata');
}

function rinominaSocieta(soc) {
  const nuovoNome = prompt('Rinomina società "' + soc + '":', soc);
  if (!nuovoNome || nuovoNome.trim() === '' || nuovoNome.trim() === soc) return;
  const nome = nuovoNome.trim();
  if (db.societa[nome]) { showToast('⚠ Esiste già una società con questo nome'); return; }
  // Sposta targhette sul nuovo nome
  db.societa[nome] = db.societa[soc];
  delete db.societa[soc];
  // Aggiorna tutti i buoni con il vecchio nome
  db.buoni.forEach(function(b) {
    if (b.societa === soc) b.societa = nome;
  });
  saveData();
  populateSocietaSelect();
  renderSocietaList();
  if (typeof renderRegistro === 'function') renderRegistro();
  showToast('✓ Società rinominata in "' + nome + '"');
}

// ═══════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function stampaBluetooth() {
  var b = currentReceiptData;
  if (!b) return;
  document.getElementById('modalStampa').classList.remove('open');
  condividiPDF(b, function() { resetForm(); });
}

function stampaBluetoothId(id) {
  var b = db.buoni.find(function(x) { return x.id === id; });
  if (!b) return;
  condividiPDF(b, null);
}

function condividiPDF(b, onDone) {
  var { jsPDF } = window.jspdf;
  var extra = b.extra || [];
  var altezza = 170 + (extra.length * 10);
  var doc = new jsPDF({ unit:'mm', format:[58,altezza], orientation:'portrait' });
  var d = new Date(b.data+'T00:00:00');
  var dataStr = d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});
  var numBuono = String(b.id).padStart(4,'0');
  var euroCarb = b.euroCarb !== undefined ? b.euroCarb : b.euro;
  var cx=29, lx=4, rx=54, y=12;

  function lineH(x1,x2,dash,col,lw) {
    doc.setLineDashPattern(dash,0); doc.setDrawColor(col,col,col); doc.setLineWidth(lw);
    doc.line(x1,y,x2,y); y+=5;
  }
  function riga(label,valore) {
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(80,80,80);
    doc.text(label.toUpperCase(),lx,y);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(0,0,0);
    doc.text(String(valore),rx,y,{align:'right'}); y+=7;
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(0,0,0);
  doc.text('DISTRIBUTORE DI CARBURANTE',cx,y,{align:'center'}); y+=7;
  doc.setFontSize(16); doc.text('TOTALERG',cx,y,{align:'center'}); y+=7;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('di Fabrizi Emanuela',cx,y,{align:'center'}); y+=6;
  doc.setFontSize(8); doc.setTextColor(80,80,80);
  doc.text('-- BUONO CARBURANTE --',cx,y,{align:'center'});
  doc.setTextColor(0,0,0); y+=5;
  lineH(4,54,[2,1.5],100,0.4);
  riga('N. Buono', numBuono);
  riga('Data', dataStr); y+=2;
  lineH(4,54,[1,1.5],180,0.2);
  riga('Societa', b.societa.toUpperCase());
  riga('Targa', b.targa||'N/D'); y+=2;
  lineH(4,54,[1,1.5],180,0.2);
  riga('Carburante', b.carburante);
  riga('Importo', 'EUR '+euroCarb.toFixed(2));
  if (extra.length > 0) {
    y+=2; lineH(4,54,[1,1.5],180,0.2);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(80,80,80);
    doc.text('ALTRI PRODOTTI',lx,y); y+=6;
    extra.forEach(function(p){ riga(p.desc,'EUR '+p.euro.toFixed(2)); });
  }
  y+=3; lineH(4,54,[2,1.5],0,0.5);
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(0,0,0);
  doc.text('TOTALE',lx,y);
  doc.setFontSize(14); doc.text('EUR '+b.euro.toFixed(2),rx,y,{align:'right'}); y+=18;
  doc.setLineDashPattern([1.5,1.5],0); doc.setDrawColor(140,140,140); doc.setLineWidth(0.3);
  doc.line(8,y,50,y); y+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,140,140);
  doc.text('Firma',cx,y,{align:'center'}); y+=10;
  doc.setFontSize(7.5); doc.setTextColor(160,160,160);
  doc.text('Grazie per la fiducia',cx,y,{align:'center'}); y+=5;
  doc.text('Conservare questo scontrino',cx,y,{align:'center'});

  var fileName = 'buono_'+numBuono+'.pdf';
  var pdfBlob = doc.output('blob');
  var file = new File([pdfBlob], fileName, {type:'application/pdf'});

  // Prova Web Share API (funziona su Chrome Android)
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:'Buono '+numBuono})
      .then(function(){ if(onDone) onDone(); })
      .catch(function(e){
        // Utente ha annullato o errore — fallback scarica
        if (e.name !== 'AbortError') {
          var url = URL.createObjectURL(pdfBlob);
          var a = document.createElement('a');
          a.href=url; a.download=fileName; a.click();
          URL.revokeObjectURL(url);
        }
        if(onDone) onDone();
      });
  } else {
    // Fallback diretto: scarica
    var url = URL.createObjectURL(pdfBlob);
    var a = document.createElement('a');
    a.href=url; a.download=fileName; a.click();
    URL.revokeObjectURL(url);
    showToast('PDF scaricato - aprilo con ESC POS app');
    if(onDone) onDone();
  }
}

// ═══════════════════════════════════════════════
//  SYNC — GOOGLE DRIVE
// ═══════════════════════════════════════════════

const DRIVE_FILE_NAME = 'autolavaggio_buoni_sync.json';

async function callDriveAPI(prompt) {
  try {
    setSyncStatus('⏳ Connessione...', '');
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }],
        mcp_servers: [{ type: 'url', url: 'https://drivemcp.googleapis.com/mcp/v1', name: 'gdrive' }]
      })
    });
    const data = await response.json();
    return data;
  } catch(e) {
    setSyncStatus('✕ Errore connessione', 'err');
    return null;
  }
}

async function salvaSuDrive() {
  setSyncStatus('⏳ Salvataggio...', '');
  const jsonData = JSON.stringify(db, null, 2);
  const prompt = `Salva o aggiorna un file chiamato "${DRIVE_FILE_NAME}" su Google Drive dell'utente con questo contenuto JSON (sostituisci se esiste già):

${jsonData}

Rispondi solo con "OK" se salvato con successo, oppure "ERRORE: motivo" se fallisce.`;

  const data = await callDriveAPI(prompt);
  if (!data) return;

  const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join(' ');
  if (textBlocks.toLowerCase().includes('ok') || textBlocks.toLowerCase().includes('salv') || textBlocks.toLowerCase().includes('creat')) {
    setSyncStatus('✓ Salvato su Drive — ' + new Date().toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'}), 'ok');
    showToast('☁ Dati salvati su Google Drive');
  } else {
    setSyncStatus('✕ Salvataggio fallito', 'err');
    showToast('⚠ Errore salvataggio Drive');
  }
}

async function caricaDaDrive() {
  setSyncStatus('⏳ Caricamento...', '');
  const prompt = `Trova e leggi il contenuto del file chiamato "${DRIVE_FILE_NAME}" su Google Drive dell'utente. Restituisci SOLO il contenuto JSON grezzo del file, senza spiegazioni, senza markdown, senza backtick. Se il file non esiste, rispondi esattamente con: FILE_NON_TROVATO`;

  const data = await callDriveAPI(prompt);
  if (!data) return;

  const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  const toolResults = (data.content || []).filter(b => b.type === 'mcp_tool_result').map(b => b.content && b.content[0] && b.content[0].text || '').join('');
  const combined = (toolResults || textBlocks).trim();

  if (combined.includes('FILE_NON_TROVATO') || combined.includes('non trovato') || combined.includes('not found')) {
    setSyncStatus('⚠ File non trovato su Drive', 'err');
    showToast('⚠ Nessun file trovato su Drive. Salva prima i dati.');
    return;
  }

  // Try to parse JSON from response
  let jsonStr = combined;
  const jsonMatch = combined.match(/\{[\s\S]*\}/);
  if (jsonMatch) jsonStr = jsonMatch[0];

  try {
    const loaded = JSON.parse(jsonStr);
    if (loaded.buoni && loaded.societa) {
      if (!confirm('Caricare i dati da Google Drive? I dati locali attuali verranno sostituiti.')) return;
      db = loaded;
      saveData();
      populateSocietaSelect();
      renderSocietaList();
      renderReport();
      setSyncStatus('✓ Caricato da Drive — ' + new Date().toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'}), 'ok');
      showToast('☁ Dati caricati da Google Drive');
    } else {
      throw new Error('Struttura non valida');
    }
  } catch(e) {
    setSyncStatus('✕ Dati non validi', 'err');
    showToast('⚠ Impossibile leggere il file Drive');
  }
}

function setSyncStatus(msg, cls) {
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.className = 'sync-status' + (cls ? ' ' + cls : '');
}

// ═══════════════════════════════════════════════
//  SYNC — ESPORTA / IMPORTA JSON
// ═══════════════════════════════════════════════

let syncMode = 'export';

function apriModalSync(mode) {
  syncMode = mode;
  const title = document.getElementById('syncModalTitle');
  const body = document.getElementById('syncModalBody');
  const btn = document.getElementById('syncModalBtn');

  if (mode === 'export') {
    title.textContent = '⬇ Esporta JSON';
    btn.textContent = 'Copia / Scarica';
    body.innerHTML = '<p style="color:var(--text-muted);font-size:13px;margin-bottom:8px;">Copia questo JSON e salvalo in un file. Puoi importarlo su qualsiasi dispositivo.</p>'
      + '<textarea class="json-area" id="syncJsonArea" readonly>' + JSON.stringify(db, null, 2) + '</textarea>'
      + '<div style="margin-top:10px;display:flex;gap:8px;">'
      + '<button class="btn btn-secondary" style="font-size:12px;padding:6px 14px;" onclick="copiaJSON()">📋 Copia</button>'
      + '<button class="btn btn-secondary" style="font-size:12px;padding:6px 14px;" onclick="scaricaJSON()">⬇ Scarica file</button>'
      + '</div>';
  } else {
    title.textContent = '⬆ Importa JSON';
    btn.textContent = 'Importa';
    body.innerHTML = '<p style="color:var(--text-muted);font-size:13px;margin-bottom:8px;">Incolla il JSON esportato da un altro dispositivo.</p>'
      + '<textarea class="json-area" id="syncJsonArea" placeholder="Incolla qui il JSON..."></textarea>';
  }

  document.getElementById('modalSync').classList.add('open');
}

function chiudiModalSync() {
  document.getElementById('modalSync').classList.remove('open');
}

function eseguiSync() {
  if (syncMode === 'export') {
    scaricaJSON();
    return;
  }
  // Import
  const raw = document.getElementById('syncJsonArea').value.trim();
  if (!raw) { showToast('⚠ Nessun dato da importare'); return; }
  try {
    const loaded = JSON.parse(raw);
    if (!loaded.buoni || !loaded.societa) throw new Error('Struttura non valida');
    if (!confirm('Importare i dati? I dati locali attuali verranno sostituiti.')) return;
    db = loaded;
    saveData();
    populateSocietaSelect();
    renderSocietaList();
    renderReport();
    chiudiModalSync();
    showToast('✓ Dati importati con successo');
  } catch(e) {
    showToast('⚠ JSON non valido: ' + e.message);
  }
}

function copiaJSON() {
  const ta = document.getElementById('syncJsonArea');
  ta.select();
  try {
    navigator.clipboard.writeText(ta.value).then(() => showToast('📋 Copiato!'));
  } catch(e) {
    document.execCommand('copy');
    showToast('📋 Copiato!');
  }
}

function scaricaJSON() {
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'autolavaggio_buoni_sync.json';
  a.click();
  showToast('⬇ File JSON scaricato');
}
